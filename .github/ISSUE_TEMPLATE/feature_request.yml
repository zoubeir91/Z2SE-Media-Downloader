name: Feature request
description: Suggest a focused improvement for Z²SE
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Z²SE prioritizes a simple everyday interface, reliability and clear recovery behavior.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: Describe the user problem first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: How should Z²SE solve it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
