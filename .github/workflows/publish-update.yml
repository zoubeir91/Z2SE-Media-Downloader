name: Publish Z2SE update

on:
  push:
    branches:
      - main
    paths:
      - release_version.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < release_version.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release_version.txt: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download previous release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREV_TAG="$(gh release view --json tagName --jq .tagName)"
          echo "Previous release: $PREV_TAG"
          mkdir -p previous payload staging
          gh release download "$PREV_TAG" -p Z2SE_UPDATE.zip -D previous
          unzip -q previous/Z2SE_UPDATE.zip -d payload

      - name: Apply release patch
        shell: bash
        run: |
          set -euo pipefail
          python release_patch.py "$VERSION"
          python -m py_compile payload/app.py payload/z2se_updater.pyw

      - name: Build update ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f staging/Z2SE_UPDATE.zip
          cd payload
          zip -q -r ../staging/Z2SE_UPDATE.zip app.py z2se_updater.pyw update_manifest.json
          cd ..
          unzip -l staging/Z2SE_UPDATE.zip

      - name: Publish or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="Z2SE v${VERSION}"
          NOTES="v32.64 strengthens Clean Manual Startup after the v32.63 field report showed that the browser extension can replay stale PART/open requests later than the original 10-second guard. Normal manual/update launches now protect timestamp-less PART/open requests for a 120-second quiet window. Fresh timestamped browser requests are accepted immediately, stale timestamped requests are rejected, and Chrome-triggered launches remain exempt. Full browser downloads are unaffected. v32.63 Health Check, v32.62 Adaptive PART Recovery Memory, and v32.61 Smart Recovery V2 remain preserved."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" staging/Z2SE_UPDATE.zip --clobber
          else
            gh release create "$TAG" staging/Z2SE_UPDATE.zip \
              --target main \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
