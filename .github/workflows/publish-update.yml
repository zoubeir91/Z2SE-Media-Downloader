name: Publish Z2SE update

on:
  push:
    branches:
      - main
    paths:
      - release_version.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < release_version.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release_version.txt: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download previous release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREV_TAG="$(gh release view --json tagName --jq .tagName)"
          echo "Previous release: $PREV_TAG"
          mkdir -p previous payload staging
          gh release download "$PREV_TAG" -p Z2SE_UPDATE.zip -D previous
          unzip -q previous/Z2SE_UPDATE.zip -d payload

      - name: Apply release patch
        shell: bash
        run: |
          set -euo pipefail
          python release_patch.py "$VERSION"
          python -m py_compile payload/app.py payload/z2se_updater.pyw

      - name: Build update ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f staging/Z2SE_UPDATE.zip
          cd payload
          zip -q -r ../staging/Z2SE_UPDATE.zip app.py z2se_updater.pyw update_manifest.json
          cd ..
          unzip -l staging/Z2SE_UPDATE.zip

      - name: Publish or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="Z2SE v${VERSION}"
          NOTES="v32.59 targets the remaining YouTube startup and PART-speed delays visible in the v32.58 journal. Browser YouTube jobs no longer run the expensive PO-token/provider preflight before every healthy download; provider health is already handled at app startup and the existing Smart Recovery still refreshes PO/client state automatically only after a real 403, PO-token or authentication failure. The supplied journal showed roughly 44 seconds from Browser job start to first transfer while yt-dlp itself began in only about 3-9 seconds, matching the repeated preflight overhead. Single Download also skips the same redundant preflight where present. AUTO PART is now less conservative: the old policy required native Turbo/full-cache to be more than 22% faster than the section estimate before choosing it. It now chooses Turbo when predicted to be about 8% faster, so cases like the supplied 10-minute PART test (SECTION≈315s vs native≈256s) use the faster native-parallel path instead of sitting around 2x realtime. Tiny sections from very large sources still stay on SECTION when that remains clearly faster. v32.58 Facebook visible-video binding, v32.57 verified-output rescue, v32.56 PART stability, v32.55 GVS/PO recovery and prior security fixes remain preserved."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" staging/Z2SE_UPDATE.zip --clobber
          else
            gh release create "$TAG" staging/Z2SE_UPDATE.zip \
              --target main \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
