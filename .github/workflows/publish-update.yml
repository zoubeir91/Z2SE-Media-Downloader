name: Publish Z2SE update

on:
  push:
    branches:
      - main
    paths:
      - release_version.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < release_version.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release_version.txt: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download previous release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREV_TAG="$(gh release view --json tagName --jq .tagName)"
          echo "Previous release: $PREV_TAG"
          mkdir -p previous payload staging
          gh release download "$PREV_TAG" -p Z2SE_UPDATE.zip -D previous
          unzip -q previous/Z2SE_UPDATE.zip -d payload

      - name: Apply release patch
        shell: bash
        run: |
          set -euo pipefail
          python release_patch.py "$VERSION"
          python -m py_compile payload/app.py payload/z2se_updater.pyw

      - name: Build update ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f staging/Z2SE_UPDATE.zip
          cd payload
          zip -q -r ../staging/Z2SE_UPDATE.zip app.py z2se_updater.pyw update_manifest.json
          cd ..
          unzip -l staging/Z2SE_UPDATE.zip

      - name: Publish or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="Z2SE v${VERSION}"
          NOTES="v32.51 bgutil startup compatibility fix: removes the unsupported --host 127.0.0.1 CLI arguments introduced in v32.50. bgutil 2.0.0 already uses its security-hardened localhost binding by default, so Z2SE now launches the provider with the supported CLI while retaining the v32.50 security protections: provider v2.0.0 verification, official plugin SHA-256 verification, pinned server source, automatic secure provider upgrade with rollback, and Health Check security/version reporting. All existing Z2SE features are preserved."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" staging/Z2SE_UPDATE.zip --clobber
          else
            gh release create "$TAG" staging/Z2SE_UPDATE.zip \
              --target main \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
