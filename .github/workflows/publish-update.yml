name: Publish Z2SE update

on:
  push:
    branches:
      - main
    paths:
      - release_version.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < release_version.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Download previous release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREV_TAG="$(gh release view --json tagName --jq .tagName)"
          mkdir -p previous payload staging
          gh release download "$PREV_TAG" -p Z2SE_UPDATE.zip -D previous
          unzip -q previous/Z2SE_UPDATE.zip -d payload
      - name: Apply release patch
        shell: bash
        run: |
          set -euo pipefail
          # Raw replacement strings contain regex-like backslashes in the generated Python.
          # Make re.sub return them literally instead of interpreting replacement escapes.
          sed -i 's/menu_pattern.subn(menu_replacement, text, count=1)/menu_pattern.subn(lambda m: menu_replacement, text, count=1)/' release_patch.py
          sed -i 's/list_pattern.subn(list_replacement, text, count=1)/list_pattern.subn(lambda m: list_replacement, text, count=1)/' release_patch.py
          python release_patch.py "$VERSION"
          # v32.70 safety normalization: the canonical download folder variable is DOWNLOADS.
          sed -i 's/DOWNLOADS_DIR/DOWNLOADS/g' payload/app.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          app = Path('payload/app.py')
          manifest_path = Path('payload/update_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          digest = hashlib.sha256(app.read_bytes()).hexdigest()
          for item in manifest.get('files', []):
              if item.get('path') == 'app.py':
                  item['sha256'] = digest
                  item['size'] = app.stat().st_size
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          python -m py_compile payload/app.py payload/z2se_updater.pyw
      - name: Build update ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f staging/Z2SE_UPDATE.zip
          cd payload
          zip -q -r ../staging/Z2SE_UPDATE.zip app.py z2se_updater.pyw update_manifest.json
      - name: Publish or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES="v32.70 is the real professional main-UI overhaul. It removes the old duplicate command bar, adds compact icon navigation, a tighter new-download card, a dense download-manager workspace with search and status shortcuts, a persistent right-side download details panel with live progress and controls, plus a live bottom status bar for total speed, active/completed jobs, folder and free disk space. The downloader engine, Smart Recovery, updater and clean-startup behavior remain unchanged."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" staging/Z2SE_UPDATE.zip --clobber
          else
            gh release create "$TAG" staging/Z2SE_UPDATE.zip --target main --title "Z2SE v${VERSION}" --notes "$NOTES"
          fi
