name: Publish Z2SE update

on:
  push:
    branches:
      - main
    paths:
      - release_version.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < release_version.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release_version.txt: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download previous release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREV_TAG="$(gh release view --json tagName --jq .tagName)"
          echo "Previous release: $PREV_TAG"
          mkdir -p previous payload staging
          gh release download "$PREV_TAG" -p Z2SE_UPDATE.zip -D previous
          unzip -q previous/Z2SE_UPDATE.zip -d payload

      - name: Apply release patch
        shell: bash
        run: |
          set -euo pipefail
          python release_patch.py "$VERSION"
          python -m py_compile payload/app.py payload/z2se_updater.pyw

      - name: Build update ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f staging/Z2SE_UPDATE.zip
          cd payload
          zip -q -r ../staging/Z2SE_UPDATE.zip app.py z2se_updater.pyw update_manifest.json
          cd ..
          unzip -l staging/Z2SE_UPDATE.zip

      - name: Publish or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="Z2SE v${VERSION}"
          NOTES="v32.53 targets Facebook Browser Bridge startup delay and browser completion UX. When captured Facebook CDN metadata exposes the real video_id, Z2SE now decodes it and jumps directly to one canonical broad-format Facebook extraction instead of wasting time on generic facebook.com extraction plus repeated format fallbacks. Browser Bridge also skips the YouTube-only PO Token startup for non-YouTube sites. Browser jobs keep their live progress callback so transfer rate, remaining time and size populate as soon as the actual media transfer begins. On successful Browser Bridge downloads, the compact job window closes and the same centered completion dialog appears with Ouvrir le fichier, Ouvrir le dossier and Annuler, using the exact verified output path. Existing v32.52 Single Download completion UX and all v32.50-v32.51 security fixes remain preserved."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" staging/Z2SE_UPDATE.zip --clobber
          else
            gh release create "$TAG" staging/Z2SE_UPDATE.zip \
              --target main \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
