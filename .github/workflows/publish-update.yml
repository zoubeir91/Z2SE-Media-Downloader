name: Publish Z2SE update

on:
  push:
    branches:
      - main
    paths:
      - release_version.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < release_version.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release_version.txt: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download previous release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREV_TAG="$(gh release view --json tagName --jq .tagName)"
          echo "Previous release: $PREV_TAG"
          mkdir -p previous payload staging
          gh release download "$PREV_TAG" -p Z2SE_UPDATE.zip -D previous
          unzip -q previous/Z2SE_UPDATE.zip -d payload

      - name: Apply release patch
        shell: bash
        run: |
          set -euo pipefail
          python release_patch.py "$VERSION"
          python -m py_compile payload/app.py payload/z2se_updater.pyw

      - name: Build update ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f staging/Z2SE_UPDATE.zip
          cd payload
          zip -q -r ../staging/Z2SE_UPDATE.zip app.py z2se_updater.pyw update_manifest.json
          cd ..
          unzip -l staging/Z2SE_UPDATE.zip

      - name: Publish or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="Z2SE v${VERSION}"
          NOTES="v32.52 improves Single Download startup and completion UX. Non-YouTube links such as Facebook, Instagram and TikTok no longer wait for the YouTube-specific PO Token provider startup, reducing unnecessary pre-download delay. Single Download now tracks the exact final yt-dlp output path and, after a successful download, closes the compact progress UI and shows a centered completion dialog with Ouvrir le fichier, Ouvrir le dossier and Annuler actions. Existing v32.51 bgutil startup compatibility fix and all v32.50 security hardening remain preserved."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" staging/Z2SE_UPDATE.zip --clobber
          else
            gh release create "$TAG" staging/Z2SE_UPDATE.zip \
              --target main \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
