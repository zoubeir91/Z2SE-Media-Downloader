name: Z2SE v32.49 Dev Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'v32_49_queue_core.py'
      - 'test_v32_49_queue_core.py'
      - 'v32_49_playlist_core.py'
      - 'test_v32_49_playlist_core.py'
      - 'release_patch.py'
      - '.github/workflows/v32-49-dev-checks.yml'
  push:
    branches: [dev-v32.49-smart-queue]
    paths:
      - 'v32_49_queue_core.py'
      - 'test_v32_49_queue_core.py'
      - 'v32_49_playlist_core.py'
      - 'test_v32_49_playlist_core.py'
      - 'release_patch.py'
      - '.github/workflows/v32-49-dev-checks.yml'

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile v32.49 cores
        run: >-
          python -m py_compile
          v32_49_queue_core.py
          test_v32_49_queue_core.py
          v32_49_playlist_core.py
          test_v32_49_playlist_core.py
      - name: Run v32.49 regression tests
        run: python -m unittest -v test_v32_49_queue_core.py test_v32_49_playlist_core.py
      - name: Compile release patch
        run: python -m py_compile release_patch.py
