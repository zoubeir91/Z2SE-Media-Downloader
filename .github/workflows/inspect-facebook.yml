name: Inspect Z2SE Facebook paths

on:
  push:
    paths:
      - '.github/workflows/inspect-facebook.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p current
          TAG="$(gh release view --json tagName --jq .tagName)"
          gh release download "$TAG" -p Z2SE_UPDATE.zip -D current
          unzip -q current/Z2SE_UPDATE.zip -d current/payload
      - name: Print Facebook and download snippets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('current/payload/app.py').read_text(encoding='utf-8', errors='replace')
          marks=['facebook','yt-dlp','def run_process','def download_full','def download_video','def download_','ffprobe','_normalize_output_path','Downloaded','completed']
          seen=[]
          for mark in marks:
              start=0
              n=0
              while True:
                  i=t.lower().find(mark.lower(), start)
                  if i<0 or n>=8: break
                  key=(max(0,i-1800), min(len(t),i+6000))
                  if all(abs(key[0]-x[0])>2500 for x in seen):
                      seen.append(key)
                      print('\n###', mark, i)
                      print(t[key[0]:key[1]])
                  start=i+len(mark)
                  n+=1
          PY
