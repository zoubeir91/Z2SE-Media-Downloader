name: Z2SE v32.49 Fix Patch

on:
  push:
    branches: [dev-v32.49-smart-queue]
    paths:
      - 'fix_v32_49_release_patch.py'
      - '.github/workflows/v32-49-fix-patch.yml'

permissions:
  contents: write

jobs:
  fix-release-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v32.49-smart-queue
      - name: Apply compatibility fix
        run: python fix_v32_49_release_patch.py
      - name: Commit fixed release patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release_patch.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix v32.49 patch anchors for real release payload"
          git push origin HEAD:dev-v32.49-smart-queue
