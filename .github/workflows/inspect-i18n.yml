name: Inspect Z2SE i18n

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-i18n.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p current
          TAG="$(gh release view --json tagName --jq .tagName)"
          gh release download "$TAG" -p Z2SE_UPDATE.zip -D current
          unzip -q current/Z2SE_UPDATE.zip -d current/payload
      - name: Print exact UI targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('current/payload/app.py').read_text(encoding='utf-8', errors='replace')
          def emit(label, needle, before=900, after=3800, occ=8):
              xs=[m.start() for m in re.finditer(re.escape(needle),t)]
              print(f'\n@@ {label} COUNT={len(xs)} POS={xs[:occ]}')
              for n,i in enumerate(xs[:occ],1):
                  print(f'\n@@@ {label}#{n}')
                  print(t[max(0,i-before):i+after])
          emit('TOOLBAR','toolbar_inner =',500,6500,2)
          emit('LOAD_BUTTON','text=tr("Load File")',1200,2600,3)
          emit('LOAD_COMMAND','command=load_liens_txt',1400,2800,5)
          emit('LANG_MENU','language_menu = tk.Menu',500,3200,2)
          emit('PROGRESS_TOPLEVEL','tk.Toplevel(',1000,5000,10)
          emit('KEYBOARD','def _show_keyboard_shortcuts',200,5000,1)
          emit('ABOUT','def _show_about_z2se',200,4200,1)
          print('\n@@ LOCALE_DIRECT_DICTS')
          for m in re.finditer(r'"darija"\s*:\s*\(',t):
              i=m.start()
              if '.get(CURRENT_LANGUAGE)' in t[i:i+3500]:
                  print('\n@@@ DIRECT',i)
                  print(t[max(0,i-1400):i+2800])
          PY