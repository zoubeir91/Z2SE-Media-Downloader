name: Inspect Z2SE i18n

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-i18n.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p current
          TAG="$(gh release view --json tagName --jq .tagName)"
          gh release download "$TAG" -p Z2SE_UPDATE.zip -D current
          unzip -q current/Z2SE_UPDATE.zip -d current/payload
      - name: Print targeted snippets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('current/payload/app.py').read_text(encoding='utf-8', errors='replace')
          def emit(label, needle, before=1000, after=5000, occ=4):
              xs=[m.start() for m in re.finditer(re.escape(needle),t)]
              print(f'\n@@ {label} COUNT={len(xs)} POS={xs[:occ]}')
              for n,i in enumerate(xs[:occ],1):
                  print(f'\n@@@ {label}#{n}')
                  print(t[max(0,i-before):i+after])
          emit('MSG_WRAPPER','_raw_showinfo',1800,7000,2)
          emit('MERGE','MERGE_TRANSLATIONS',800,7000,2)
          emit('MTR','def _mtr',800,3500,1)
          emit('MINI_BUTTONS','mini_pause_button =',2200,4800,1)
          emit('MINI_VARS','mini_status_var =',1400,3500,1)
          emit('PROGRESS_GEOMETRY','window.geometry(',800,1800,10)
          PY