name: Z2SE Release Integration

on:
  push:
    branches:
      - 'dev-v*'
    paths:
      - 'release_patch.py'
      - 'release_version.txt'
      - 'test_v32_94_release_patch.py'
      - '.github/workflows/v32-49-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'release_patch.py'
      - 'release_version.txt'
      - 'test_v32_94_release_patch.py'
      - '.github/workflows/v32-49-integration.yml'

permissions:
  contents: read

jobs:
  patch-latest-release-payload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download current public update payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path .probe | Out-Null
          gh release download --repo "${{ github.repository }}" --pattern Z2SE_UPDATE.zip --dir .probe
          Expand-Archive -Path .probe/Z2SE_UPDATE.zip -DestinationPath payload -Force
      - name: Read target version
        shell: pwsh
        run: |
          $version = (Get-Content release_version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+$') { throw "Invalid release version: $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Compile patch and regression test
        run: python -m py_compile release_patch.py test_v32_94_release_patch.py
      - name: Apply current patch to real latest release
        run: python release_patch.py $env:VERSION
      - name: Compile patched application and updater
        run: python -m py_compile payload/app.py payload/z2se_updater.pyw
      - name: Verify manifest version
        shell: pwsh
        run: |
          $manifest = Get-Content payload/update_manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION) {
            throw "Manifest version $($manifest.version) does not match $env:VERSION"
          }
