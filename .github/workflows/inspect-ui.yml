name: Inspect current Z2SE UI

on:
  push:
    branches: [main]
    paths:
      - inspect_trigger.txt
      - .github/workflows/inspect-ui.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p current
          TAG="$(gh release view --json tagName --jq .tagName)"
          echo "TAG=$TAG"
          gh release download "$TAG" -p Z2SE_UPDATE.zip -D current
          unzip -q current/Z2SE_UPDATE.zip -d current/payload
      - name: Inspect visible UI copy and menu code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('current/payload/app.py')
          t=p.read_text(encoding='utf-8', errors='replace')
          print('APP_VERSION:', re.search(r'APP_VERSION\s*=\s*[\"\']([^\"\']+)', t).group(1))
          print('\n=== tr(...) KEYS ===')
          keys=[]
          for m in re.finditer(r'tr\(\s*[\"\']([^\"\']+)[\"\']\s*\)', t):
              k=m.group(1)
              if k not in keys: keys.append(k)
          for k in keys: print(k)
          print('\n=== MAIN UI SNIPPET ===')
          marks=['MAIN UI','top_brand =','toolbar =','editor_card =','downloads_card =','bottom_status']
          starts=[t.find(m) for m in marks if t.find(m)>=0]
          if starts:
              s=min(starts)
              print(t[s:s+18000])
          print('\n=== MENU SNIPPETS ===')
          for pat in ['tools_menu', 'file_menu', 'help_menu', 'language_menu']:
              i=t.find(pat)
              if i>=0: print('\n--',pat,'--\n',t[max(0,i-500):i+4500])
          PY
