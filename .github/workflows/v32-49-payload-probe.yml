name: Z2SE v32.49 Payload Probe

on:
  push:
    branches: [dev-v32.49-smart-queue]
    paths:
      - '.github/workflows/v32-49-payload-probe.yml'
      - 'v32_49_probe.py'

permissions:
  contents: read

jobs:
  probe-latest-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest release payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern Z2SE_UPDATE.zip --dir .probe
          unzip -q .probe/Z2SE_UPDATE.zip -d .probe/payload
      - name: Probe v32.48 app anchors
        run: python v32_49_probe.py .probe/payload/app.py
